server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: expense-tracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/expenses}
    username: ${DB_USER:expenses}
    password: ${DB_PASSWORD:expenses}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  mail:
    # optional: without a host, reset codes are written to the log instead of emailed
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes-long!!}
    ttl-hours: ${JWT_TTL_HOURS:24}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:no-reply@expense-tracker.local}
  google:
    # from Google Cloud Console > Credentials > OAuth client ID (Web application).
    # Leave empty to run with email/password sign-in only.
    client-id: ${GOOGLE_CLIENT_ID:}

# only the health endpoint, and no internals in the response
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # email is optional, so an unconfigured mail server must not mark the app unhealthy
    mail:
      enabled: false

logging:
  level:
    org.springframework.security: INFO
