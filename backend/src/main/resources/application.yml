server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: expense-tracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/expenses}
    username: ${DB_USER:expenses}
    password: ${DB_PASSWORD:expenses}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes-long!!}
    ttl-hours: ${JWT_TTL_HOURS:24}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

logging:
  level:
    org.springframework.security: INFO
