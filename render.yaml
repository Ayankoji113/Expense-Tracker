# One-click deploy on Render: https://render.com/docs/blueprint-spec
# Set GOOGLE_CLIENT_ID and the MAIL_* variables in the dashboard if you want those features.
services:
  - type: web
    name: expense-tracker-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      # Render can only hand out a postgresql:// string, while the JDBC driver wants jdbc:postgresql://
      # so paste the Internal Database URL host here after the first deploy, e.g.
      #   jdbc:postgresql://dpg-xxxx-a.oregon-postgres.render.com/expenses
      - key: DB_URL
        sync: false
      - key: DB_USER
        fromDatabase:
          name: expense-tracker-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: expense-tracker-db
          property: password
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: expense-tracker-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: expense-tracker-db
    databaseName: expenses
    user: expenses
